[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attribution"
version = "0.2.0"
description = "Return attribution engine for Indian equity portfolios (decision view and factor view)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["attribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
